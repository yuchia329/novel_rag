[project]
name = "novel-rag"
version = "0.1.0"
description = "Hybrid vector + knowledge-graph RAG over long Chinese novels, with a reproducible evaluation harness."
requires-python = ">=3.12"
dependencies = [
    "httpx[http2]>=0.27",
    "selectolax>=0.3.21",
    "lancedb>=0.13",
    "pyarrow>=16",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "rich>=13",
    "tenacity>=8.3",
    "openai>=1.40",
    "opencc-python-reimplemented>=0.1.7",
    "jieba>=0.42",
    "sentence-transformers>=3.0",
    "transformers>=4.40",
    "networkx>=3.2",
    "torch>=2.3",
    "streamlit>=1.37",
]

[project.scripts]
novel-rag = "novel_rag.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/novel_rag"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
